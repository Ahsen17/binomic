name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'test_integration/**'
              - 'assets/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Makefile'
              - '.pre-commit-config.yaml'
              - '.github/workflows/pytest.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check src tests test_integration
          uv run ruff format --check src tests test_integration

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests --cov -n auto

      - name: Integration tests
        run: uv run pytest test_integration -m integration

  sentinel:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Start Sentinel topology
        run: docker compose -f assets/sentinel/docker-compose.yml up -d --wait

      - name: Verify Sentinel topology
        run: |
          uv run python -c "from redis import Redis; r = Redis(port=26380, socket_timeout=5); addr = r.execute_command('SENTINEL', 'get-master-addr-by-name', 'binomic'); assert addr and int(addr[1]) == 6380, addr; print('Sentinel topology is reachable')"

      - name: Sentinel tests
        run: uv run pytest test_integration/ha/test_sentinel_pipeline.py -m ha -q

      - name: Stop Sentinel topology
        if: always()
        run: docker compose -f assets/sentinel/docker-compose.yml down -v
