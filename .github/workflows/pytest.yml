name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint
        run: |
          uv run ruff check src tests test_integration
          uv run ruff format --check src tests test_integration

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests --cov -n auto

      - name: Integration tests
        run: uv run pytest test_integration -m integration
